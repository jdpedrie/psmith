version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  # Pinned to go.mod's connectrpc.com/connect: unpinned, the plugin's
  # latest emits code for connect/v2 and nothing compiles.
  - remote: buf.build/connectrpc/go:v1.19.2
    out: gen
    opt: paths=source_relative
  - remote: buf.build/apple/swift
    out: clients/PsmithSwift/Sources/PsmithKit/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  - remote: buf.build/connectrpc/swift
    out: clients/PsmithSwift/Sources/PsmithKit/Generated
    opt:
      - Visibility=Public
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
      - FileNaming=PathToUnderscores
